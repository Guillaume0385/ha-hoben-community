name: Experimental campaign trigger proof (secretless)

# This workflow is NOT an observation job. A MANAGER-only branch creation
# from protected experimental can prove whether GitHub emits a push event.
# Neither this workflow nor its JS gate may read Hoben secrets or environments.
on:
  push:
    branches:
      - 'hoben-campaign-proof/**'

permissions: {}

concurrency:
  group: experimental-campaign-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  proof:
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/heads/hoben-campaign-proof/') &&
      github.actor == 'Guillaume0385' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate exact MANAGER branch creation and protected SHA
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const {verify} = require('./.github/scripts/experimental-campaign-trigger-proof.cjs');
            try {
              const result = await verify({github, context});
              await core.summary.addRaw('SECRETLESS_TRIGGER_OBSERVED; no Hoben access, no observation approval.').write();
              core.info('SECRETLESS_TRIGGER_OBSERVED: ' + result.sha);
            } catch (_) {
              core.setFailed('NOT RUN: unverified GitHub branch trigger; no observation permitted.');
            }
