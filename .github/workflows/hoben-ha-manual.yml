# Issue #126: inert form only. No HA client, environment or collector is invoked.
name: Vérification réelle Home Assistant (non activée)
'on':
  workflow_dispatch:
    inputs:
      scenario:
        description: Choix prévu uniquement — tous les scénarios sont NOT RUN
        required: true
        type: choice
        default: hoben-live
        options:
        - hoben-live
        - open-errors
        - refresh-v4
        - session-reuse
        - session-reconnect
        - cleanup
        - availability
        - all
permissions: {}
jobs:
  not-activated:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
    - name: Refuser toute collecte non activée
      shell: bash
      run: |
        printf '%s\n' '## Vérification réelle Home Assistant — NOT RUN' >> "$GITHUB_STEP_SUMMARY"
        printf '%s\n' 'Campagne non activée. Tous les choix, y compris all, sont refusés.' >> "$GITHUB_STEP_SUMMARY"
        printf '%s\n' 'Aucun client ou coordinator exécuté. Une tâche et une revue distinctes sont nécessaires avant activation.' >> "$GITHUB_STEP_SUMMARY"
        printf '%s\n' 'Résultat global : FAILURE (non activé). Aucune validation Home Assistant.' >> "$GITHUB_STEP_SUMMARY"
        printf '%s\n' '::error::NOT RUN: campagne HA non activée pour tous les scénarios et toutes les branches.'
        exit 1
