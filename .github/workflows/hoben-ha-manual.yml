# Issue #126: manual only; native environments and shared mutex remain mandatory.
name: Vérification réelle Home Assistant
'on':
  workflow_dispatch:
    inputs:
      scenario:
        description: Observation manuelle en lecture seule — scénario individuel ou all séquentiel
        required: true
        type: choice
        default: hoben-live
        options:
        - hoben-live
        - open-errors
        - refresh-v4
        - session-reuse
        - session-reconnect
        - cleanup
        - availability
        - all
permissions: {}
concurrency:
  group: hoben-read-only-observation
  cancel-in-progress: false
  queue: max
env:
  CAMPAIGN: ha
jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    outputs:
      admitted: ${{ steps.context.outputs.admitted }}
      collector_ready: ${{ steps.context.outputs.collector_ready }}
    steps:
    - name: Vérifier le contexte manuel autorisé
      id: context
      shell: bash
      env:
        REQUEST_REPOSITORY: ${{ github.repository }}
        REQUEST_EVENT: ${{ github.event_name }}
        REQUEST_ACTOR: ${{ github.actor }}
        REQUEST_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        REQUEST_REF: ${{ github.ref }}
      run: |
        node <<'NODE'
        const fs = require('node:fs');
        const catalogs = {
          protocol: ['tls-only', 'session-open', 'read-v4-state', 'h1h2', 'session-300', 'session-reconnect', 'all'],
          ha: ['hoben-live', 'open-errors', 'refresh-v4', 'session-reuse', 'session-reconnect', 'cleanup', 'availability', 'all'],
        };
        const choices = Object.hasOwn(catalogs, process.env.CAMPAIGN) ? catalogs[process.env.CAMPAIGN] : [];
        let scenario;
        try {
          const file = process.env.GITHUB_EVENT_PATH;
          if (fs.statSync(file).size <= 256 * 1024) {
            const event = JSON.parse(fs.readFileSync(file, 'utf8'));
            scenario = event && event.inputs && event.inputs.scenario;
          }
        } catch {
          // Missing/malformed event metadata never grants admission.
        }
        const admitted =
          process.env.REQUEST_REPOSITORY === 'Guillaume0385/ha-hoben-community' &&
          process.env.REQUEST_EVENT === 'workflow_dispatch' &&
          process.env.REQUEST_ACTOR === 'Guillaume0385' &&
          process.env.REQUEST_TRIGGERING_ACTOR === 'Guillaume0385' &&
          ['refs/heads/experimental', 'refs/heads/main'].includes(process.env.REQUEST_REF) &&
          choices.includes(scenario);
        try {
          // Only the closed implemented catalog can reach the protected collector.
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            'admitted=' + String(admitted) + '\ncollector_ready=' + String(admitted) + '\n');
          console.log(admitted ? 'admission_context_checked' : '::error::admission_context_refused');
          process.exitCode = admitted ? 0 : 1;
        } catch {
          console.error('::error::admission_output_unavailable');
          process.exitCode = 1;
        }
        NODE
  collect:
    needs: admission
    if: needs.admission.result == 'success' && needs.admission.outputs.admitted == 'true' && needs.admission.outputs.collector_ready
      == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    environment: hoben-live
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Préparer le runtime HA épinglé sans identité Hoben
      timeout-minutes: 8
      run: env -u DOCKER_HOST -u DOCKER_CONTEXT -u DOCKER_TLS -u DOCKER_TLS_VERIFY -u DOCKER_CERT_PATH docker
        --host=unix:///var/run/docker.sock build --secret id=proxy_ca,src=/etc/ssl/certs/ca-certificates.crt
        --iidfile "$RUNNER_TEMP/hoben-ha-runtime.id" scripts/ha_session_runtime
    - id: capture
      name: Collecte bornée — aucune sortie privée
      env:
        HOBEN_USER_GUID: ${{ secrets.HOBEN_USER_GUID }}
        HOBEN_DEVICE_GUID: ${{ secrets.HOBEN_DEVICE_GUID }}
      run: python -I scripts/run_campaign.py ha
    - id: exports
      if: always()
      name: Valider la projection fermée avant transfert
      run: node .github/scripts/campaign-report.cjs prepare
    outputs:
      report_b64: ${{ steps.exports.outputs.report_b64 }}
  result:
    needs:
    - admission
    - collect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - name: Rapport de refus sans checkout ni secret
      shell: bash
      env:
        ADMISSION_RESULT: ${{ needs.admission.result }}
        ADMITTED: ${{ needs.admission.outputs.admitted }}
      run: |
        node <<'NODE'
        const fs = require('node:fs');
        const catalogs = {
          protocol: ['tls-only', 'session-open', 'read-v4-state', 'h1h2', 'session-300', 'session-reconnect', 'all'],
          ha: ['hoben-live', 'open-errors', 'refresh-v4', 'session-reuse', 'session-reconnect', 'cleanup', 'availability', 'all'],
        };
        const choices = Object.hasOwn(catalogs, process.env.CAMPAIGN) ? catalogs[process.env.CAMPAIGN] : [];
        let scenario;
        try {
          const file = process.env.GITHUB_EVENT_PATH;
          if (fs.statSync(file).size <= 256 * 1024) {
            const event = JSON.parse(fs.readFileSync(file, 'utf8'));
            scenario = event && event.inputs && event.inputs.scenario;
          }
        } catch {
          // Missing/malformed event metadata never grants admission.
        }
        const selected = scenario === 'all' ? choices.filter(x => x !== 'all') :
          choices.includes(scenario) ? [scenario] : [];
        const checked = process.env.ADMISSION_RESULT === 'success' && process.env.ADMITTED === 'true';
        const reason = checked ? 'collector_not_connected' : 'admission_not_verified';
        const report = {
          admission: checked ? 'checked' : 'not_verified',
          stages: selected.map(scenario => ({scenario, status: 'NOT RUN', reason})),
          execution: 'NOT RUN',
          actions_result: 'FAILURE',
        };
        const lines = ['## Campagne non raccordée — NOT RUN', '',
          '| Scénario | Résultat |', '| --- | --- |',
          ...selected.map(scenario => '| ' + scenario + ' | NOT RUN |'),
          ...(selected.length ? [] : ['Sélection non attestée : NOT RUN.']),
          '', 'Résultat global : FAILURE. Aucun test réel exécuté.', ''];
        try {
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n'));
          console.log(JSON.stringify(report));
        } catch {
          console.error('::error::campaign_summary_unavailable');
        }
        console.error('::error::NOT RUN: scenarios_not_connected');
        process.exitCode = 1;
        NODE
      if: needs.admission.result != 'success' || needs.admission.outputs.admitted != 'true'
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      if: needs.admission.result == 'success' && needs.admission.outputs.admitted == 'true'
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - id: public
      if: needs.admission.result == 'success' && needs.admission.outputs.admitted == 'true'
      name: Validation indépendante et résultat par scénario
      env:
        PUBLIC_REPORT_B64: ${{ needs.collect.outputs.report_b64 }}
        COLLECT_RESULT: ${{ needs.collect.result }}
      run: node .github/scripts/campaign-report.cjs publish
    - if: always() && steps.public.outputs.report == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ha-campaign-${{ github.sha }}-${{ github.run_id }}-a${{ github.run_attempt }}
        path: ${{ runner.temp }}/hoben-campaign-published/report.json
        if-no-files-found: error
        retention-days: 7
