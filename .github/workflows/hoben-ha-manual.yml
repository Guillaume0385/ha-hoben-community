# Issue #126: manual only; native environments and shared mutex remain mandatory.
name: Vérification réelle Home Assistant
'on':
  workflow_dispatch:
    inputs:
      scenario:
        description: Observation manuelle en lecture seule — scénario individuel ou all séquentiel
        required: true
        type: choice
        default: hoben-live
        options:
        - hoben-live
        - open-errors
        - refresh-v4
        - session-reuse
        - session-reconnect
        - cleanup
        - availability
        - all
        - dual-session-observation
permissions: {}
concurrency:
  group: hoben-read-only-observation
  cancel-in-progress: false
  queue: max
env:
  CAMPAIGN: ha
jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    outputs:
      admitted: ${{ steps.context.outputs.admitted }}
      collector_ready: ${{ steps.context.outputs.collector_ready }}
    steps:
    - name: Vérifier le contexte manuel autorisé
      id: context
      shell: bash
      env:
        REQUEST_REPOSITORY: ${{ github.repository }}
        REQUEST_EVENT: ${{ github.event_name }}
        REQUEST_ACTOR: ${{ github.actor }}
        REQUEST_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        REQUEST_REF: ${{ github.ref }}
      run: |
        node <<'NODE'
        const fs = require('node:fs');
        const catalogs = {
          protocol: ['tls-only', 'session-open', 'read-v4-state', 'h1h2', 'session-300', 'session-reconnect', 'all'],
          ha: ['hoben-live', 'open-errors', 'refresh-v4', 'session-reuse', 'session-reconnect', 'cleanup', 'availability', 'all', 'dual-session-observation'],
        };
        const choices = Object.hasOwn(catalogs, process.env.CAMPAIGN) ? catalogs[process.env.CAMPAIGN] : [];
        let scenario;
        try {
          const file = process.env.GITHUB_EVENT_PATH;
          if (fs.statSync(file).size <= 256 * 1024) {
            const event = JSON.parse(fs.readFileSync(file, 'utf8'));
            scenario = event && event.inputs && event.inputs.scenario;
          }
        } catch {
          // Missing/malformed event metadata never grants admission.
        }
        const admitted =
          process.env.REQUEST_REPOSITORY === 'Guillaume0385/ha-hoben-community' &&
          process.env.REQUEST_EVENT === 'workflow_dispatch' &&
          process.env.REQUEST_ACTOR === 'Guillaume0385' &&
          process.env.REQUEST_TRIGGERING_ACTOR === 'Guillaume0385' &&
          (scenario === 'hoben-live' ? process.env.REQUEST_REF === 'refs/heads/experimental' :
            ['refs/heads/experimental', 'refs/heads/main'].includes(process.env.REQUEST_REF)) &&
          // The legacy "all" sequence includes hoben-live but has no per-stage gate.
          // Refuse the entire selection instead of running #207 without D4 admission.
          scenario !== 'all' && choices.includes(scenario);
        try {
          // Only the closed implemented catalog can reach the protected collector.
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            'admitted=' + String(admitted) + '\ncollector_ready=' + String(admitted) + '\n');
          console.log(admitted ? 'admission_context_checked' : '::error::admission_context_refused');
          process.exitCode = admitted ? 0 : 1;
        } catch {
          console.error('::error::admission_output_unavailable');
          process.exitCode = 1;
        }
        NODE
  d4-preflight:
    needs: admission
    if: needs.admission.result == 'success' && needs.admission.outputs.admitted == 'true' && inputs.scenario == 'hoben-live'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: D4-D — préflight authentifié sans secret Hoben
      id: d4-preflight
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: node scripts/ha_live_d4_preflight.cjs
  d4-claim:
    needs: d4-preflight
    if: needs.d4-preflight.result == 'success' && inputs.scenario == 'hoben-live'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: D4-D — réserver une seule tentative si la durabilité est prouvée
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: node scripts/ha_live_d4_claim.cjs
  collect:
    needs: [admission, d4-preflight, d4-claim]
    if: >-
      ${{ always() && needs.admission.result == 'success' &&
      needs.admission.outputs.admitted == 'true' &&
      needs.admission.outputs.collector_ready == 'true' &&
      ((inputs.scenario == 'hoben-live' && needs.d4-preflight.result == 'success' &&
      needs.d4-claim.result == 'success') ||
      (inputs.scenario != 'hoben-live' && inputs.scenario != 'all' &&
      needs.d4-preflight.result == 'skipped' && needs.d4-claim.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.scenario == 'dual-session-observation' && 15 || 40 }}
    permissions:
      contents: read
    environment: hoben-live
    steps:
    - name: Armer le plafond global du scénario optionnel avant préparation
      if: inputs.scenario == 'dual-session-observation'
      shell: bash
      run: |
        python3 - <<'PYTHON'
        import os, time
        with open(os.environ['GITHUB_ENV'], 'a') as output:
            output.write('HOBEN_DUAL_STARTED_NS=' + str(time.monotonic_ns()) + '\n')
        PYTHON
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - id: d4-recheck
      name: D4-D — recheck après entrée dans l’environnement, sans secret Hoben
      if: inputs.scenario == 'hoben-live'
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        node scripts/ha_live_d4_preflight.cjs
        echo "approved=true" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Préparer le runtime HA épinglé sans identité Hoben
      timeout-minutes: 8
      run: env -u DOCKER_HOST -u DOCKER_CONTEXT -u DOCKER_TLS -u DOCKER_TLS_VERIFY -u DOCKER_CERT_PATH docker
        --host=unix:///var/run/docker.sock build --secret id=proxy_ca,src=/etc/ssl/certs/ca-certificates.crt
        --iidfile "$RUNNER_TEMP/hoben-ha-runtime.id" scripts/ha_session_runtime
    - name: D4-D — installer le runtime Home Assistant épinglé sans identité
      if: inputs.scenario == 'hoben-live' && steps.d4-recheck.outputs.approved == 'true'
      run: python -m pip install --disable-pip-version-check -r scripts/ha_session_runtime/requirements.txt
    - id: capture
      name: Collecte historique bornée — aucune sortie privée
      if: inputs.scenario != 'hoben-live'
      env:
        HOBEN_USER_GUID: ${{ secrets.HOBEN_USER_GUID }}
      run: python -I scripts/run_campaign.py ha
    - id: d4-capture
      name: D4-D — vrai client et coordinateur HA, observation 300 s
      if: inputs.scenario == 'hoben-live' && steps.d4-recheck.outputs.approved == 'true'
      env:
        HOBEN_USER_GUID: ${{ secrets.HOBEN_USER_GUID }}
      run: python -I scripts/ha_live_d4_run.py
    - id: exports
      if: always() && inputs.scenario != 'hoben-live'
      name: Valider la projection historique
      run: node .github/scripts/campaign-report.cjs prepare
    - id: d4-exports
      if: always() && inputs.scenario == 'hoben-live'
      name: D4-D — projection publique fermée
      run: node .github/scripts/ha-live-d4-report.cjs prepare
    outputs:
      report_b64: ${{ steps.d4-exports.outputs.report_b64 || steps.exports.outputs.report_b64 }}
  result:
    needs:
    - admission
    - d4-preflight
    - d4-claim
    - collect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - name: Rapport de refus sans checkout ni secret
      shell: bash
      env:
        ADMISSION_RESULT: ${{ needs.admission.result }}
        ADMITTED: ${{ needs.admission.outputs.admitted }}
      run: |
        node <<'NODE'
        const fs = require('node:fs');
        const catalogs = {
          protocol: ['tls-only', 'session-open', 'read-v4-state', 'h1h2', 'session-300', 'session-reconnect', 'all'],
          ha: ['hoben-live', 'open-errors', 'refresh-v4', 'session-reuse', 'session-reconnect', 'cleanup', 'availability', 'all', 'dual-session-observation'],
        };
        const choices = Object.hasOwn(catalogs, process.env.CAMPAIGN) ? catalogs[process.env.CAMPAIGN] : [];
        let scenario;
        try {
          const file = process.env.GITHUB_EVENT_PATH;
          if (fs.statSync(file).size <= 256 * 1024) {
            const event = JSON.parse(fs.readFileSync(file, 'utf8'));
            scenario = event && event.inputs && event.inputs.scenario;
          }
        } catch {
          // Missing/malformed event metadata never grants admission.
        }
        const selected = scenario === 'all' ? choices.filter(x => x !== 'all' && x !== 'dual-session-observation') :
          choices.includes(scenario) ? [scenario] : [];
        const reason = 'admission_not_verified';
        const report = {
          admission: 'not_verified',
          stages: selected.map(scenario => ({scenario, status: 'NOT RUN', reason})),
          execution: 'NOT RUN',
          actions_result: 'FAILURE',
        };
        const lines = ['## Admission non vérifiée — NOT RUN', '',
          '| Scénario | Résultat |', '| --- | --- |',
          ...selected.map(scenario => '| ' + scenario + ' | NOT RUN |'),
          ...(selected.length ? [] : ['Sélection non attestée : NOT RUN.']),
          '', 'Résultat global : FAILURE. Collecte non admise.', ''];
        try {
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n'));
          console.log(JSON.stringify(report));
        } catch {
          console.error('::error::campaign_summary_unavailable');
        }
        console.error('::error::NOT RUN: admission_not_verified');
        process.exitCode = 1;
        NODE
      if: needs.admission.result != 'success' || needs.admission.outputs.admitted != 'true'
    - name: D4-D — NOT RUN si préflight ou réservation non attestés
      if: inputs.scenario == 'hoben-live' && (needs.d4-preflight.result != 'success' || needs.d4-claim.result != 'success')
      shell: bash
      run: |
        echo '## D4-D — NOT RUN (sécurité non attestée)' >> "$GITHUB_STEP_SUMMARY"
        echo '::error::D4-D NOT RUN: preflight_or_durable_claim_unverified'
        exit 1
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      if: needs.admission.result == 'success' && needs.admission.outputs.admitted == 'true'
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - id: public
      if: needs.admission.result == 'success' && needs.admission.outputs.admitted == 'true' && inputs.scenario != 'hoben-live'
      name: Validation indépendante et résultat par scénario
      env:
        PUBLIC_REPORT_B64: ${{ needs.collect.outputs.report_b64 }}
        COLLECT_RESULT: ${{ needs.collect.result }}
      run: node .github/scripts/campaign-report.cjs publish
    - id: d4-public
      if: inputs.scenario == 'hoben-live' && needs.d4-preflight.result == 'success' && needs.d4-claim.result == 'success'
      name: D4-D — vérification indépendante du rapport (runner sans secret)
      env:
        PUBLIC_REPORT_B64: ${{ needs.collect.outputs.report_b64 }}
        COLLECT_RESULT: ${{ needs.collect.result }}
      run: node .github/scripts/ha-live-d4-report.cjs publish
    - if: always() && (steps.public.outputs.report == 'true' || steps.d4-public.outputs.report == 'true')
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ha-campaign-${{ github.sha }}-${{ github.run_id }}-a${{ github.run_attempt }}
        path: ${{ runner.temp }}/hoben-campaign-published/report.json
        if-no-files-found: error
        retention-days: 7
