name: Validate

on:
  push:
    branches: [main, 'chore/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

permissions: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group dev
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m ruff format --check .

  ha-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group ha-test
      - run: python -m pytest -c ha_tests/pytest.ini ha_tests

  hacs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          comment: 'false'

  hassfest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@master
