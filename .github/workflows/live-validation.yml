name: Live Validation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Live validation mode
        required: true
        type: choice
        default: tls-only
        options:
          - tls-only
          - session-open
          - read-v4-state
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  # Every mode that can open a Hoben socket holds the same repository mutex.
  group: >-
    ${{ ((github.event_name == 'workflow_dispatch' &&
         (inputs.mode == 'tls-only' ||
          (github.ref == 'refs/heads/main' &&
           (inputs.mode == 'session-open' || inputs.mode == 'read-v4-state')))) ||
        (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
         (github.event.label.name == 'live-validation' ||
          github.event.label.name == 'live-session-negative'))) &&
        'hoben-boundary-campaign' || format('hoben-unrelated-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max

jobs:
  live-validation:
    # Only the newly added label opts in; an existing label never authorizes a push.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'tls-only') ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'live-validation')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    env:
      # Label-triggered validation stays TLS-only, independently of future inputs.
      LIVE_MODE: tls-only
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Diagnostic header
        run: |
          printf 'Runner OS: %s\n' "$RUNNER_OS"
          python --version
          printf '%s\n' 'Endpoint: myhoben.fr:465'

      - name: Run selected live probe
        id: probe
        run: |
          case "$LIVE_MODE" in
            tls-only)
              printf '%s\n' 'Mode: tls-only'
              # Bash pipefail preserves failure while tee retains sanitized JSON.
              python scripts/probe_hoben_connection.py --tls-only | tee "$RUNNER_TEMP/live-validation.json"
              ;;
            *)
              printf '%s\n' 'Unsupported live validation mode.' >&2
              exit 1
              ;;
          esac

      - name: Summarize live validation
        if: ${{ always() }}
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          result=failure
          if [ "$PROBE_OUTCOME" = success ]; then
            result=success
          fi
          {
            printf '%s\n' '## Live Hoben validation'
            printf '\nMode: %s\n\nEndpoint: myhoben.fr:465\n\nResult: %s\n' "$LIVE_MODE" "$result"
            if [ -s "$RUNNER_TEMP/live-validation.json" ]; then
              printf '\nProbe output (sanitized JSON):\n\n```json\n'
              cat "$RUNNER_TEMP/live-validation.json"
              printf '\n```\n'
            else
              printf '\nProbe output unavailable (probe did not complete).\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve probe JSON
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: live-validation-output
          path: ${{ runner.temp }}/live-validation.json
          if-no-files-found: ignore

  read-v4-state:
    # Same protection as session-open: the environment must independently allow
    # only protected main. No PR label can select this real application read.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'read-v4-state' &&
      github.ref == 'refs/heads/main'
    name: One-shot raw V4 read validation
    environment: hoben-live
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Diagnostic header
        run: |
          printf 'Runner OS: %s\n' "$RUNNER_OS"
          python --version
          printf '%s\n' 'Mode: read-v4-state' 'Endpoint: myhoben.fr:465'

      - name: Open V4 and read exactly 20 raw registers once
        id: probe
        env:
          HOBEN_USER_GUID: ${{ secrets.HOBEN_USER_GUID }}
        run: |
          # Repository code owns the fixed request and response validation.
          # Exit 0 requires a matching read; blocked/exception/error exits 1.
          python scripts/probe_hoben_connection.py --read-v4-state | tee "$RUNNER_TEMP/live-validation.json"

      - name: Summarize raw V4 read or failure
        if: ${{ always() }}
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          result=failure
          if [ "$PROBE_OUTCOME" = success ]; then
            result=read
          fi
          {
            printf '%s\n' '## Live Hoben V4 read validation'
            printf '\nMode: read-v4-state\n\nEndpoint: myhoben.fr:465\n\nResult: %s\n' "$result"
            printf '\nOne read only; raw UInt16 registers without semantic interpretation.\n'
            if [ -s "$RUNNER_TEMP/live-validation.json" ]; then
              printf '\nProbe output (sanitized JSON):\n\n```json\n'
              cat "$RUNNER_TEMP/live-validation.json"
              printf '\n```\n'
            else
              printf '\nProbe output unavailable (probe did not complete).\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve raw V4 probe JSON
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: live-v4-read-output
          path: ${{ runner.temp }}/live-validation.json
          if-no-files-found: ignore

  live-session-negative:
    # A newly added, distinct label is the only opt-in. No secret or environment.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'live-session-negative'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Diagnostic header
        run: |
          printf 'Runner OS: %s\n' "$RUNNER_OS"
          python --version
          printf '%s\n' 'Mode: session-negative' 'Endpoint: myhoben.fr:465'
          printf '%s\n' 'Synthetic negative test; no real authentication is validated.'

      - name: Observe one synthetic OpenClient
        id: probe
        run: |
          # Fixed test inputs live in the probe; no HOBEN_* environment inputs.
          # Exit 0 records an informative reply/EOF, not an authenticated session.
          python scripts/probe_hoben_connection.py --session-negative | tee "$RUNNER_TEMP/live-session-negative.json"

      - name: Summarize negative observation
        if: ${{ always() }}
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          result=inconclusive
          if [ "$PROBE_OUTCOME" = success ]; then
            result=informative
          fi
          {
            printf '%s\n' '## Negative Hoben session observation'
            printf '\nMode: session-negative\n\nEndpoint: myhoben.fr:465\n\nResult: %s\n' "$result"
            printf '\nSynthetic/unassigned UserGuid and normal initial DeviceGuid; no authentication validated.\n'
            if [ -s "$RUNNER_TEMP/live-session-negative.json" ]; then
              printf '\nProbe output (sanitized JSON):\n\n```json\n'
              cat "$RUNNER_TEMP/live-session-negative.json"
              printf '\n```\n'
            else
              printf '\nProbe output unavailable (probe did not complete).\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve negative probe JSON
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: live-session-negative-output
          path: ${{ runner.temp }}/live-session-negative.json
          if-no-files-found: ignore

  session-open:
    # Defense in depth: hoben-live MUST independently allow only the protected
    # main branch before adding its secret. An unreviewed branch can edit this if.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'session-open' &&
      github.ref == 'refs/heads/main'
    name: First-client session observation
    environment: hoben-live
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Diagnostic header
        run: |
          printf 'Runner OS: %s\n' "$RUNNER_OS"
          python --version
          printf '%s\n' 'Mode: session-open' 'Endpoint: myhoben.fr:465'

      - name: Validate UserGuid and observe one OpenClient
        id: probe
        env:
          # Add only after verifying hoben-live's main-only deployment policy.
          HOBEN_USER_GUID: ${{ secrets.HOBEN_USER_GUID }}
        run: |
          # Exit 0 means a classified response, not necessarily authentication.
          # pipefail retains errors while tee preserves only sanitized JSON.
          python scripts/probe_hoben_connection.py --session | tee "$RUNNER_TEMP/live-validation.json"

      - name: Summarize first response or failure
        if: ${{ always() }}
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          result=failure
          if [ "$PROBE_OUTCOME" = success ]; then
            result=observed
          fi
          {
            printf '%s\n' '## Live Hoben validation'
            printf '\nMode: session-open\n\nEndpoint: myhoben.fr:465\n\nResult: %s\n' "$result"
            printf '\nFirst response only; no authentication code requested or sent.\n'
            if [ -s "$RUNNER_TEMP/live-validation.json" ]; then
              printf '\nProbe output (sanitized JSON):\n\n```json\n'
              cat "$RUNNER_TEMP/live-validation.json"
              printf '\n```\n'
            else
              printf '\nProbe output unavailable (probe did not complete).\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve probe JSON
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: live-validation-output
          path: ${{ runner.temp }}/live-validation.json
          if-no-files-found: ignore
