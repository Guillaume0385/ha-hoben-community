name: Live Validation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Live validation mode
        required: true
        type: choice
        default: tls-only
        options:
          - tls-only
          - session-open
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  live-validation:
    # Only the newly added label opts in; an existing label never authorizes a push.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'tls-only') ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'live-validation')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    env:
      # Label-triggered validation stays TLS-only, independently of future inputs.
      LIVE_MODE: tls-only
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Diagnostic header
        run: |
          printf 'Runner OS: %s\n' "$RUNNER_OS"
          python --version
          printf '%s\n' 'Endpoint: myhoben.fr:465'

      - name: Run selected live probe
        id: probe
        run: |
          case "$LIVE_MODE" in
            tls-only)
              printf '%s\n' 'Mode: tls-only'
              # Bash pipefail preserves failure while tee retains sanitized JSON.
              python scripts/probe_hoben_connection.py --tls-only | tee "$RUNNER_TEMP/live-validation.json"
              ;;
            *)
              printf '%s\n' 'Unsupported live validation mode.' >&2
              exit 1
              ;;
          esac

      - name: Summarize live validation
        if: ${{ always() }}
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          result=failure
          if [ "$PROBE_OUTCOME" = success ]; then
            result=success
          fi
          {
            printf '%s\n' '## Live Hoben validation'
            printf '\nMode: %s\n\nEndpoint: myhoben.fr:465\n\nResult: %s\n' "$LIVE_MODE" "$result"
            if [ -s "$RUNNER_TEMP/live-validation.json" ]; then
              printf '\nProbe output (sanitized JSON):\n\n```json\n'
              cat "$RUNNER_TEMP/live-validation.json"
              printf '\n```\n'
            else
              printf '\nProbe output unavailable (probe did not complete).\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve probe JSON
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: live-validation-output
          path: ${{ runner.temp }}/live-validation.json
          if-no-files-found: ignore

  session-open:
    # Secrets are never available to the PR-label job, including same-repo PRs.
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'session-open'
    name: Session open (UserGuid preflight)
    environment: hoben-live
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Diagnostic header
        run: |
          printf 'Runner OS: %s\n' "$RUNNER_OS"
          python --version
          printf '%s\n' 'Mode: session-open' 'Endpoint: myhoben.fr:465'

      - name: Run session preflight and one-shot probe
        id: probe
        env:
          # Configure this manually as an environment secret in hoben-live.
          HOBEN_DEVICE_GUID: ${{ secrets.HOBEN_DEVICE_GUID }}
        run: |
          # Exit 3 means BLOCKED, not a server/protocol failure. pipefail retains
          # that non-success result while tee preserves only sanitized JSON.
          python scripts/probe_hoben_connection.py --session | tee "$RUNNER_TEMP/live-validation.json"

      - name: Summarize session success, BLOCKED or failure
        if: ${{ always() }}
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          result=failure
          if [ -s "$RUNNER_TEMP/live-validation.json" ] && \
             python -c 'import json, sys; r = json.load(open(sys.argv[1])); sys.exit(0 if r.get("state") == "blocked" and r.get("error") == "user_guid_unresolved" else 1)' "$RUNNER_TEMP/live-validation.json"; then
            result=BLOCKED
            printf '%s\n' '::warning::BLOCKED: user_guid_unresolved; no connection or OpenClient sent.'
          elif [ "$PROBE_OUTCOME" = success ]; then
            result=success
          fi
          {
            printf '%s\n' '## Live Hoben validation'
            printf '\nMode: session-open\n\nEndpoint: myhoben.fr:465\n\nResult: %s\n' "$result"
            if [ -s "$RUNNER_TEMP/live-validation.json" ]; then
              printf '\nProbe output (sanitized JSON):\n\n```json\n'
              cat "$RUNNER_TEMP/live-validation.json"
              printf '\n```\n'
            else
              printf '\nProbe output unavailable (probe did not complete).\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve probe JSON
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: live-validation-output
          path: ${{ runner.temp }}/live-validation.json
          if-no-files-found: ignore
